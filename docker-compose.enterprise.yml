services:
  n8n:
    image: n8nio/n8n:latest
    container_name: fleetmoto_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_PUBLIC_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-CHANGE_ME_LONG_RANDOM_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Africa/Antananarivo
    volumes:
      - fleetmoto_n8n_data:/home/node/.n8n
    profiles: ["automation"]
    networks:
      - fleetmoto

  ollama:
    image: ollama/ollama:latest
    container_name: fleetmoto_ollama
    restart: unless-stopped
    volumes:
      - fleetmoto_ollama_data:/root/.ollama
    profiles: ["ai"]
    networks:
      - fleetmoto

volumes:
  fleetmoto_n8n_data:
  fleetmoto_ollama_data:
