services:
  # ------------------------------------------------------------------
  # PHP-FPM — cœur applicatif Laravel
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: fleetmoto_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fleetmoto

  # ------------------------------------------------------------------
  # Nginx — serveur web devant PHP-FPM
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: fleetmoto_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7490}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - fleetmoto

  # ------------------------------------------------------------------
  # MySQL — base de données par défaut du stack local.
  # Démarre automatiquement avec `docker compose up`. En ligne (VPS,
  # Railway, etc.) tu pourras soit garder ce conteneur, soit basculer
  # sur une base managée (Neon/PlanetScale/RDS) en changeant juste
  # DB_CONNECTION + DB_HOST dans .env, sans toucher au reste du stack.
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: fleetmoto_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-moto_api}
      MYSQL_USER: ${DB_USERNAME:-ismael}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Dev@2026Mysql!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@2026!}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - fleetmoto_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Root@2026!}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - fleetmoto

  # ------------------------------------------------------------------
  # phpMyAdmin — interface web pour administrer MySQL.
  # Actif par défaut, branché sur le conteneur "mysql" ci-dessus.
  # Interface : http://localhost:7489
  # ------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: fleetmoto_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-Root@2026!}
      UPLOAD_LIMIT: 20M
    ports:
      - "${PHPMYADMIN_PORT:-7489}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fleetmoto

  # ------------------------------------------------------------------
  # Mailpit — capture les emails envoyés par Laravel (reset password,
  # notifications…) sans jamais les envoyer pour de vrai. Pratique en
  # local pour vérifier le contenu des emails.
  # UI : http://localhost:1089   |   SMTP : mailpit:1025
  # Mets dans .env : MAIL_HOST=mailpit / MAIL_PORT=1025
  # docker compose --profile mail up -d
  # ------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: fleetmoto_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-1089}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    profiles: ["mail"]
    networks:
      - fleetmoto

  # ------------------------------------------------------------------
  # Worker de queue (optionnel — activer si QUEUE_CONNECTION != sync)
  # docker compose --profile queue up -d
  # ------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: fleetmoto_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --backoff=5 --sleep=3
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - app
    profiles: ["queue"]
    networks:
      - fleetmoto

  # ------------------------------------------------------------------
  # Redis (optionnel — cache/queue). Aujourd'hui le .env utilise
  # CACHE_STORE=file et QUEUE_CONNECTION=sync, donc inactif par défaut.
  # docker compose --profile redis up -d
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fleetmoto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fleetmoto_redis_data:/data
    profiles: ["redis"]
    networks:
      - fleetmoto

  # ------------------------------------------------------------------
  # Postgres/Neon local (optionnel — seulement si tu veux tester en
  # 100% offline avec Postgres plutôt que MySQL).
  # docker compose --profile local-postgres up -d
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fleetmoto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-moto_api}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - fleetmoto_pgdata:/var/lib/postgresql/data
    profiles: ["local-postgres"]
    networks:
      - fleetmoto

networks:
  fleetmoto:
    driver: bridge

volumes:
  fleetmoto_pgdata:
  fleetmoto_redis_data:
  fleetmoto_mysqldata: